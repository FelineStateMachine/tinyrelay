app = "tiny-edge"
primary_region = "dfw"

[build]

[env]
  TS_HOSTNAME = "tiny-edge"
  TS_STATE_DIR = "/var/lib/tailscale"
  RELAY_TAILNET_HOST = "100.87.95.99"

[mounts]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1000

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
